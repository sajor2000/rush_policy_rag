[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    synthetic: marks tests as using synthetic/generated test data
    slow: marks tests as slow (deselect with '-m "not slow"')
    critical: marks tests as critical for CI/CD pipeline
