name: RAG Evaluation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly evaluation every Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - quick
          - weekly
          - monthly-regression

env:
  PYTHON_VERSION: '3.11'
  AOAI_ENDPOINT: ${{ secrets.AOAI_ENDPOINT }}
  AOAI_API_KEY: ${{ secrets.AOAI_API_KEY }}
  AOAI_EVAL_DEPLOYMENT: gpt-4.1-mini
  AOAI_CHAT_DEPLOYMENT: gpt-4.1
  SEARCH_ENDPOINT: ${{ secrets.SEARCH_ENDPOINT }}
  SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
  COHERE_RERANK_ENDPOINT: ${{ secrets.COHERE_RERANK_ENDPOINT }}
  COHERE_RERANK_API_KEY: ${{ secrets.COHERE_RERANK_API_KEY }}

jobs:
  # Pre-production evaluation on PR/push
  pre-prod-evaluation:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_type != 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p apps/backend/reports

      # Gate 2-3: DeepEval CI/CD Tests
      - name: Run DeepEval Tests (Gates 2-3)
        id: deepeval
        run: |
          cd apps/backend
          pytest tests/test_rag_evaluation.py -v --tb=short \
            --junitxml=reports/junit.xml \
            -x  # Stop on first failure for fast feedback
        env:
          DEEPEVAL_PER_ATTEMPT_TIMEOUT_SECONDS_OVERRIDE: 240
          DEEPEVAL_TIMEOUT_SECONDS: 600
          BACKEND_URL: http://localhost:8000
        continue-on-error: true

      - name: Check test results
        if: steps.deepeval.outcome == 'failure'
        run: |
          echo "::error::DeepEval tests failed. Check the test results for details."
          exit 1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-prod-test-results
          path: |
            apps/backend/reports/
          retention-days: 30

      - name: Post test summary
        if: always()
        run: |
          echo "## Pre-Production Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deepeval.outcome }}" == "success" ]; then
            echo "✅ All gates passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  # Weekly production monitoring
  weekly-evaluation:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p apps/backend/data
          mkdir -p eval_reports

      - name: Generate weekly sample
        run: |
          python scripts/integrate_realistic_questions.py \
            --weekly-eval --sample 50 --seed $(date +%W)

      - name: Run combined weekly report
        run: |
          python scripts/run_combined_weekly_report.py \
            --local-queries apps/backend/data/weekly_eval_queries.json \
            ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
        env:
          STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
          AZURE_COMM_CONNECTION_STRING: ${{ secrets.AZURE_COMM_CONNECTION_STRING }}
          AZURE_COMM_SENDER_ADDRESS: ${{ secrets.AZURE_COMM_SENDER_ADDRESS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      - name: Upload weekly report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_number }}
          path: eval_reports/
          retention-days: 90

      - name: Post weekly summary
        if: always()
        run: |
          echo "## Weekly Evaluation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Week: $(date +%W)" >> $GITHUB_STEP_SUMMARY
          echo "Sample size: 50 queries" >> $GITHUB_STEP_SUMMARY
          if [ -f eval_reports/eval_report_*.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Metrics Summary" >> $GITHUB_STEP_SUMMARY
            cat eval_reports/eval_report_*.json | jq -r '.summary | to_entries[] | "- \(.key): \(.value)"' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Report parsing failed" >> $GITHUB_STEP_SUMMARY
          fi

      # Promptfoo RAG evaluation (100 cases, 80% threshold)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Promptfoo evaluation
        id: promptfoo
        run: |
          mkdir -p reports
          npx promptfoo eval \
            -c tests/promptfoo/promptfooconfig.yaml \
            -o reports/promptfoo_eval_weekly.json \
            --no-progress-bar
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        continue-on-error: true

      - name: Check Promptfoo pass rate
        if: always() && steps.promptfoo.outcome != 'skipped'
        run: |
          if [ ! -f reports/promptfoo_eval_weekly.json ]; then
            echo "::warning::Promptfoo report not generated"
            exit 0
          fi
          echo "## Promptfoo RAG Evaluation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json, sys
          with open('reports/promptfoo_eval_weekly.json') as f:
              data = json.load(f)
          r = data.get('results', data)
          rows = r.get('results', []) if isinstance(r, dict) else []
          if isinstance(rows, list) and rows:
              total = len(rows)
              passed = sum(1 for row in rows if isinstance(row, dict) and row.get('success', False))
          else:
              table = r.get('table', {}) if isinstance(r, dict) else {}
              body = table.get('body', []) if isinstance(table, dict) else []
              total = len(body)
              passed = sum(1 for row in body if isinstance(row, dict) and row.get('pass', False))
          rate = (passed / total * 100) if total > 0 else 0
          print(f'Promptfoo: {passed}/{total} ({rate:.1f}%)')
          print(f'| Metric | Value |', file=sys.stderr)
          print(f'|--------|-------|', file=sys.stderr)
          print(f'| Pass rate | {rate:.1f}% |', file=sys.stderr)
          print(f'| Passed | {passed}/{total} |', file=sys.stderr)
          if rate < 80:
              print(f'::warning::Promptfoo pass rate {rate:.1f}% below 80% threshold')
          " 2>> \$GITHUB_STEP_SUMMARY

      - name: Upload Promptfoo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promptfoo-report-${{ github.run_number }}
          path: reports/promptfoo_eval_weekly.json
          retention-days: 90

  # Quick smoke test for hotfixes
  quick-test:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run critical tests only
        run: |
          cd apps/backend
          pytest tests/test_rag_evaluation.py -v -m "critical" --tb=short
        env:
          DEEPEVAL_PER_ATTEMPT_TIMEOUT_SECONDS_OVERRIDE: 120

  # Monthly RAGAS regression testing
  monthly-regression:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'monthly-regression'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p reports/ragas

      - name: Run RAGAS regression
        id: ragas
        run: |
          python scripts/run_ragas_regression.py \
            --golden-set data/golden_test_set.json \
            --backend-url ${{ secrets.BACKEND_URL }} \
            --output reports/ragas/ragas_${{ github.run_number }}.json
        env:
          AOAI_ENDPOINT: ${{ secrets.AOAI_ENDPOINT }}
          AOAI_API_KEY: ${{ secrets.AOAI_API_KEY }}
          AOAI_EVAL_DEPLOYMENT: gpt-4.1-mini
          AOAI_EMBEDDING_DEPLOYMENT: text-embedding-3-large
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        continue-on-error: true

      - name: Check RAGAS results
        if: always()
        run: |
          echo "## RAGAS Regression Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/ragas/ragas_${{ github.run_number }}.json ]; then
            python3 -c "
          import json
          with open('reports/ragas/ragas_${{ github.run_number }}.json') as f:
              data = json.load(f)
          metrics = data.get('metrics', {})
          print('| Metric | Score |')
          print('|--------|-------|')
          for k, v in metrics.items():
              score = f'{v:.3f}' if isinstance(v, float) else str(v)
              print(f'| {k} | {score} |')
          reg = data.get('regression_check', {})
          if reg:
              print(f'')
              print(f'**Regression status**: {reg.get(\"status\", \"N/A\")}')
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "RAGAS report not generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload RAGAS report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-regression-${{ github.run_number }}
          path: reports/ragas/
          retention-days: 90
