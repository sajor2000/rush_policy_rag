name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}  # Deny all by default; grant per job

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "black==25.1.0" isort flake8 mypy

      - name: Check formatting with Black
        run: black --check --diff .

      - name: Check import sorting with isort
        run: isort --check-only --diff --profile black .

      - name: Lint with flake8
        run: flake8 .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
        env:
          # Use mock values for CI - tests should mock Azure services
          SEARCH_ENDPOINT: https://test.search.windows.net
          SEARCH_API_KEY: test-key
          AOAI_ENDPOINT: https://test.openai.azure.com
          AOAI_API_KEY: test-key
          # Disable AAD auth for CI (no Azure AD in GitHub runners)
          REQUIRE_AAD_AUTH: "false"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  hr-stabilization-regressions:
    name: HR Stabilization Regression Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run HR stabilization suites
        run: |
          pytest -q \
            tests/test_query_validation.py \
            tests/test_synonym_service.py \
            tests/test_query_enhancer.py \
            tests/test_chat_service.py \
            tests/test_search_metadata.py \
            tests/test_on_your_data_service.py \
            tests/test_script_index_safety.py \
            tests/test_monthly_release_gate.py
        env:
          SEARCH_ENDPOINT: https://test.search.windows.net
          SEARCH_API_KEY: test-key
          AOAI_ENDPOINT: https://test.openai.azure.com
          AOAI_API_KEY: test-key
          REQUIRE_AAD_AUTH: "false"

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run check

      - name: Lint with ESLint
        run: npm run lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: frontend-lint
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: pip-audit (Python dependency vulnerabilities)
        run: |
          pip install pip-audit
          # Audit prod deps only; eval deps (requirements-eval.txt) have complex
          # transitive trees audited separately in RAG Evaluation workflow.
          # TEMPORARY: diskcache CVE has no published fixed version yet.
          # Tracking: https://github.com/RushAI-jcr/policychat_rush/issues/4
          pip-audit -r apps/backend/requirements.txt --ignore-vuln CVE-2025-69872

      - name: npm audit (Node.js dependency vulnerabilities)
        working-directory: apps/frontend
        run: npm audit --audit-level=high

      - name: Bandit (Python security linter)
        run: |
          pip install bandit
          bandit -r apps/backend/app/ -ll -ii --skip B101

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-lint
      - backend-test
      - hr-stabilization-regressions
      - frontend-lint
      - frontend-build
      - dependency-audit
      - security-scan
    steps:
      - name: Check CI results
        run: |
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "HR Regressions: ${{ needs.hr-stabilization-regressions.result }}"
          echo "Frontend Lint: ${{ needs.frontend-lint.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"

      - name: Fail if any required job did not succeed
        if: >-
          needs.backend-lint.result != 'success' ||
          needs.backend-test.result != 'success' ||
          needs.hr-stabilization-regressions.result != 'success' ||
          needs.frontend-lint.result != 'success' ||
          needs.frontend-build.result != 'success' ||
          needs.dependency-audit.result != 'success' ||
          needs.security-scan.result != 'success'
        run: |
          echo "::error::One or more CI jobs did not succeed. Deployment blocked."
          exit 1

      - name: CI passed
        run: echo "All CI checks passed. Deployment is authorized."
