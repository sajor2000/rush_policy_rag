name: Deploy to Azure Container Apps

on:
  # Triggered automatically when CI workflow completes on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Manual trigger for emergency deployments
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: 'Skip CI gate check (emergency only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions: {}  # Deny all by default; grant per job

concurrency:
  group: deploy-nonprod
  cancel-in-progress: false  # Never cancel in-progress deploys

env:
  CONTAINER_REGISTRY: aiinnovation.azurecr.io
  RESOURCE_GROUP: RU-A-NonProd-AI-Innovation-RG
  BACKEND_APP: rush-policy-backend
  FRONTEND_APP: rush-policy-frontend

jobs:
  # ─────────────────────────────────────────────────────────
  # Gate: Resolve SHA and verify CI passed
  # ─────────────────────────────────────────────────────────
  check-ci:
    name: Verify CI Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha_short: ${{ steps.resolve.outputs.sha_short }}

    steps:
      - name: Resolve commit SHA
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Resolved SHA: $SHA (${SHA:0:7})"

      - name: Verify branch is main
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
            echo "::error::Deployment only allowed from main branch, got: ${{ github.event.workflow_run.head_branch }}"
            exit 1
          fi

      - name: Check CI result
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion != 'success'
        run: |
          echo "::error::CI workflow did not succeed (result: ${{ github.event.workflow_run.conclusion }}). Deployment blocked."
          exit 1

      - name: Verify branch is main (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Manual deployment only allowed from main branch, got: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Verify CI passed (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_ci_check != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          echo "Checking CI status for commit $SHA..."
          # Query the CI workflow's conclusion for this commit
          STATUS=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "not_found"')
          if [ "$STATUS" != "success" ]; then
            echo "::error::CI workflow has not passed for this commit (status: $STATUS). Use skip_ci_check=true for emergencies only."
            exit 1
          fi
          echo "CI passed for commit $SHA"

      - name: Check manual dispatch CI skip
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.skip_ci_check == 'true'
        run: |
          echo "::warning::CI gate bypassed via manual dispatch. This should only be used for emergencies."

  # ─────────────────────────────────────────────────────────
  # Build: Backend image (SHA-tagged)
  # ─────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: check-ci
    outputs:
      image: ${{ env.CONTAINER_REGISTRY }}/rush-policy-backend:${{ needs.check-ci.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.CONTAINER_REGISTRY }}/rush-policy-backend:${{ needs.check-ci.outputs.sha_short }}
            ${{ env.CONTAINER_REGISTRY }}/rush-policy-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ─────────────────────────────────────────────────────────
  # Build: Frontend image (SHA-tagged)
  # ─────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: check-ci
    outputs:
      image: ${{ env.CONTAINER_REGISTRY }}/rush-policy-frontend:${{ needs.check-ci.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.CONTAINER_REGISTRY }}/rush-policy-frontend:${{ needs.check-ci.outputs.sha_short }}
            ${{ env.CONTAINER_REGISTRY }}/rush-policy-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.BACKEND_URL }}

  # ─────────────────────────────────────────────────────────
  # Deploy: NonProd environment
  # ─────────────────────────────────────────────────────────
  deploy-nonprod:
    name: Deploy to NonProd
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [check-ci, build-backend, build-frontend]
    environment: nonprod

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.BACKEND_APP }}
          imageToDeploy: ${{ needs.build-backend.outputs.image }}

      - name: Deploy Frontend Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.FRONTEND_APP }}
          imageToDeploy: ${{ needs.build-frontend.outputs.image }}

      - name: Verify backend health
        run: |
          echo "Waiting for backend to stabilize..."
          sleep 30
          HEALTH_URL="${{ secrets.BACKEND_URL }}/health"
          for i in 1 2 3 4 5; do
            echo "Health check attempt $i/5..."
            if curl -sf --max-time 10 "$HEALTH_URL"; then
              echo ""
              echo "Backend is healthy."
              exit 0
            fi
            echo "Attempt $i failed, waiting 30s..."
            sleep 30
          done
          echo "::error::Backend health check failed after 5 attempts."
          exit 1

      - name: Verify frontend reachable
        run: |
          FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
          if curl -sf --max-time 10 "$FRONTEND_URL" > /dev/null; then
            echo "Frontend is reachable."
          else
            echo "::warning::Frontend health check failed. Container may still be starting."
          fi

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | NonProd |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ needs.check-ci.outputs.sha_short }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Backend Image** | \`${{ needs.build-backend.outputs.image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Frontend Image** | \`${{ needs.build-frontend.outputs.image }}\` |" >> "$GITHUB_STEP_SUMMARY"
